# automation-image — build & publish the self-heal control-plane image.
#
# Publishes through the ESTATE'S SHARED LANE (SocioProphet/.github build-image.yml), not a
# hand-rolled build. That reusable workflow owns login-host derivation, the SHA/latest/semver
# tagging contract the Argo ApplicationSets promote, and KEYLESS cosign signing (Fulcio/Rekor
# via the job's OIDC identity) so admission can verify provenance. A bespoke copy of that logic
# here would drift from the estate and re-earn bugs the shared lane already fixed.
#
# Credentials: registry.socioprophet.ai is htpasswd-walled and has no GCP identity, so the push
# uses `registry_auth: basic` with the ZOT_CI_* ORG secrets (scoped to prophet-platform +
# sociosphere only). One credential for the estate, one rotation point — not a per-repo copy.
#
# The moving-tag trap: the shared lane pushes an immutable `<sha>` tag AND moves `latest`.
# Deploy from the DIGEST (or the sha tag), never `latest` — with the default
# `imagePullPolicy: IfNotPresent`, a node that cached `latest` silently runs stale code.
name: automation-image

on:
  # NOTE: the two `paths` lists are duplicated on purpose. GitHub Actions does NOT support
  # YAML anchors/aliases — a `&anchor`/`*alias` parses fine locally (PyYAML resolves it) and
  # is then rejected by GitHub, which is a false-green waiting to happen. Keep them in sync.
  push:
    branches: [main]
    paths:
      # Rebuild only when something the image actually ships changes.
      - 'automation/**'
      - 'registry/**'
      - 'third_party/**'
      - 'engines/**'
      - 'tools/**'
      - 'requirements-dev.txt'
      - 'deployment/Dockerfile'
      - '.github/workflows/automation-image.yml'
  pull_request:
    paths:
      - 'automation/**'
      - 'registry/**'
      - 'third_party/**'
      - 'engines/**'
      - 'tools/**'
      - 'requirements-dev.txt'
      - 'deployment/Dockerfile'
      - '.github/workflows/automation-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # cosign keyless signing in the shared lane

concurrency:
  group: automation-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Deploy-integrity gate — runs with NO credentials, so it also protects pull requests.
  #
  # This is the control that caught the original paper tiger: the image built fine but was
  # missing loop dependencies, so every scheduler job would ImportError at runtime while the
  # heartbeat stayed green. `scheduler.preflight()` fails fast on exactly that, and running it
  # INSIDE the freshly built image is the only way to prove the shipped artifact can boot.
  # It costs one extra build; that is the price of the control, and it is worth paying.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push, no credentials)
        run: docker build -f deployment/Dockerfile -t automation:verify .
      - name: Prove the built image can preflight the loop
        run: docker run --rm automation:verify python -c "from automation.scheduler import preflight; preflight(); print('preflight OK')"

  # Publish only after the artifact is proven bootable, and never from a pull request (a fork
  # PR gets no secrets, and an unreviewed PR must not be able to publish an estate image).
  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    uses: SocioProphet/.github/.github/workflows/build-image.yml@main
    with:
      image: sociosphere-automation
      context: .
      dockerfile: deployment/Dockerfile
      registry: registry.socioprophet.ai
      registry_auth: basic
    secrets:
      registry_username: ${{ secrets.ZOT_CI_USERNAME }}
      registry_password: ${{ secrets.ZOT_CI_PASSWORD }}

  report:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Report the pinnable reference
        run: |
          {
            echo "## automation-image"
            echo ""
            echo "- image:  \`${{ needs.publish.outputs.image }}\`"
            echo "- digest: \`${{ needs.publish.outputs.digest }}\`"
            echo ""
            echo "**Pin \`deployment/kubernetes.yaml\` to the digest** —"
            echo "\`registry.socioprophet.ai/sociosphere-automation@${{ needs.publish.outputs.digest }}\`."
            echo "Never deploy from \`:latest\` (moving tag + IfNotPresent = a node silently runs stale code)."
          } >> "$GITHUB_STEP_SUMMARY"
