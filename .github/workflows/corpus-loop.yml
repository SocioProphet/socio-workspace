name: corpus-loop

on:
  workflow_dispatch:
  push:
    paths:
      - 'schemas/corpus-loop*.schema.json'
      - 'registry/corpus-loop-v*/**'
      - 'reports/corpus-loop*'
      - 'tools/check_clv*.py'
      - 'tools/resolve_clv1.py'
      - 'tools/assemble_corpus_loop_demo.py'
      - 'tools/check_corpus_loop_demo_packet.py'
      - 'tools/check_corpus_loop_customer_readout.py'
      - 'apps/ui-workbench/src/generated/corpusLoopV1.ts'
      - 'apps/ui-workbench/src/components/corpus/CorpusLoopPanel.vue'
      - 'Makefile'
      - '.github/workflows/corpus-loop.yml'
  pull_request:
    paths:
      - 'schemas/corpus-loop*.schema.json'
      - 'registry/corpus-loop-v*/**'
      - 'reports/corpus-loop*'
      - 'tools/check_clv*.py'
      - 'tools/resolve_clv1.py'
      - 'tools/assemble_corpus_loop_demo.py'
      - 'tools/check_corpus_loop_demo_packet.py'
      - 'tools/check_corpus_loop_customer_readout.py'
      - 'apps/ui-workbench/src/generated/corpusLoopV1.ts'
      - 'apps/ui-workbench/src/components/corpus/CorpusLoopPanel.vue'
      - 'Makefile'
      - '.github/workflows/corpus-loop.yml'

permissions:
  contents: read

jobs:
  corpus-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install jsonschema

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/ui-workbench/package-lock.json

      - name: Install UI dependencies
        run: make ui-install

      - name: Corpus loop aggregate check
        run: make corpus-loop-check
