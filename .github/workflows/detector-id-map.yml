name: Detector Id Map

on:
  pull_request:
    paths:
      - "standards/epistemic-governance/detector-id-map.yaml"
      - "standards/epistemic-governance/bias-catalog.yaml"
      - "standards/epistemic-governance/detector-countertest-map.yaml"
      - "tools/validate_detector_id_map.py"
      - ".github/workflows/detector-id-map.yml"
  push:
    branches:
      - main
    paths:
      - "standards/epistemic-governance/detector-id-map.yaml"
      - "standards/epistemic-governance/bias-catalog.yaml"
      - "standards/epistemic-governance/detector-countertest-map.yaml"
      - "tools/validate_detector_id_map.py"
      - ".github/workflows/detector-id-map.yml"

jobs:
  validate-detector-id-map:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependency
        # Pinned — an unpinned parser makes CI non-reproducible.
        run: python -m pip install 'pyyaml==6.0.2'
      - name: Validate detector-id map + bias catalog
        run: python tools/validate_detector_id_map.py
      - name: Selftest (teeth both ways)
        run: python tools/validate_detector_id_map.py --selftest
