name: Epistemic Governance Registry

on:
  pull_request:
    paths:
      - "registry/epistemic-governance.yaml"
      - "tools/validate_epistemic_governance_registry.py"
      - ".github/workflows/epistemic-governance-registry.yml"
  push:
    branches:
      - main
    paths:
      - "registry/epistemic-governance.yaml"
      - "tools/validate_epistemic_governance_registry.py"
      - ".github/workflows/epistemic-governance-registry.yml"

jobs:
  validate-epistemic-governance-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependency
        # Pinned: an unpinned parser makes CI non-reproducible — a new upstream
        # release can change behaviour and fail unrelated PRs.
        run: python -m pip install 'pyyaml==6.0.2'
      - name: Validate epistemic-governance registry
        run: python tools/validate_epistemic_governance_registry.py
