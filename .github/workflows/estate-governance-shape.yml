name: estate-governance-shape

# `make registry-validate` has existed for a long time and no workflow ever ran it.
# That is why a repository could be auto-admitted, sit in registry/admissions/ with a
# null role and no lane, and have every merge cascade to nothing -- the validation was
# written, had a Makefile target, and never executed. A gate nobody runs is a comment.
#
# This runs it, plus the admission-shape check that fails when an admitted repo never
# reached a governed shape (no lane, no dependency edges, no propagation rule).

on:
  pull_request:
    paths:
      - 'registry/**'
      - 'engines/propagation_engine.py'
      - 'engines/ontology_engine.py'
      - 'tools/check_admission_governance_shape.py'
      - 'tools/build_effective_canonical_registry.py'
      - 'tools/validate_registry_admissions.py'
      - 'Makefile'
      - '.github/workflows/estate-governance-shape.yml'
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'engines/propagation_engine.py'
      - 'engines/ontology_engine.py'
      - 'tools/check_admission_governance_shape.py'
      - 'tools/build_effective_canonical_registry.py'
      - 'tools/validate_registry_admissions.py'
      - 'Makefile'
      - '.github/workflows/estate-governance-shape.yml'
  schedule:
    # An admission's grace window expires with the calendar, not with a commit. Without
    # a scheduled run an unshaped repo stays green simply because nobody touched the
    # registry -- which is exactly how 29 of them accumulated.
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  governance-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Registry validation (admissions, ontology roles, dependency cycles)
        run: make registry-validate

      - name: Admission governance shape
        run: python3 tools/check_admission_governance_shape.py

      - name: Report (always, so the shape is visible even on failure)
        if: always()
        run: python3 tools/check_admission_governance_shape.py --json > admission-shape.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-governance-shape
          path: admission-shape.json
