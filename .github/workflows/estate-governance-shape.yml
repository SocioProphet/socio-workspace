name: estate-governance-shape

# CORRECTION to this file's original rationale: an earlier version of this comment (and
# of the commit that added it) claimed `make registry-validate` had never been run by any
# workflow. That was FALSE -- validate.yml has run it on every push and pull_request all
# along. The claim was made without checking validate.yml, and it is corrected here
# rather than quietly dropped.
#
# The real defect is worse than an unrun gate. The gate RAN, PASSED, and did not check.
# registry-validate verified that an admission fragment had the right schema and folded
# it into an effective list; it never asked whether the admitted repo acquired a lane,
# dependency edges, or a propagation rule. So a repo could be admitted, validated green
# on every PR, and still have every merge cascade to nothing. A control that executes and
# checks the wrong thing is more dangerous than one that never executes, because it also
# supplies the reassurance.
#
# admission-governance-shape-validate is now a prerequisite of registry-validate, so it
# runs wherever that target does -- including validate.yml. This workflow adds what a
# per-PR gate cannot: a weekly run, because an admission's grace window expires with the
# calendar rather than with a commit, and a retained JSON artifact of the shape.

on:
  pull_request:
    paths:
      - 'registry/**'
      - 'engines/propagation_engine.py'
      - 'engines/ontology_engine.py'
      - 'tools/check_admission_governance_shape.py'
      - 'tools/build_effective_canonical_registry.py'
      - 'tools/validate_registry_admissions.py'
      - 'Makefile'
      - '.github/workflows/estate-governance-shape.yml'
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'engines/propagation_engine.py'
      - 'engines/ontology_engine.py'
      - 'tools/check_admission_governance_shape.py'
      - 'tools/build_effective_canonical_registry.py'
      - 'tools/validate_registry_admissions.py'
      - 'Makefile'
      - '.github/workflows/estate-governance-shape.yml'
  schedule:
    # An admission's grace window expires with the calendar, not with a commit. Without
    # a scheduled run an unshaped repo stays green simply because nobody touched the
    # registry -- which is exactly how 29 of them accumulated.
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  governance-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pyyaml

      # Runs admission-governance-shape, gossip-beacon-audit and
      # propagation-feedback as prerequisites -- listing them again as separate
      # steps would execute each twice.
      - name: Registry validation
        run: make registry-validate

      - name: Report (always, so the shape is visible even on failure)
        if: always()
        run: |
          python3 tools/check_admission_governance_shape.py --json > admission-shape.json || true
          python3 tools/check_propagation_feedback.py --json > propagation-feedback.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-governance-shape
          path: |
            admission-shape.json
            propagation-feedback.json
