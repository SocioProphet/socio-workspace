name: lattice-placement-spine

on:
  push:
    branches: [main]
    paths:
      - 'registry/lattice-**'
      - 'spec/lattice/**'
      - 'tools/**lattice**'
      - 'tools/runner/**'
      - '.github/workflows/lattice-placement-spine.yml'
  pull_request:
    branches: [main]
    paths:
      - 'registry/lattice-**'
      - 'spec/lattice/**'
      - 'tools/**lattice**'
      - 'tools/runner/**'
      - '.github/workflows/lattice-placement-spine.yml'
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Validate Lattice placement spine registry
        run: python scripts/validate_lattice_placement_spine.py
