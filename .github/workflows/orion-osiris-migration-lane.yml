name: Orion OSIRIS Migration Lane

on:
  push:
    paths:
      - 'registry/orion-osiris-excavation-migration.yaml'
      - 'tools/validate_orion_osiris_migration_lane.py'
      - '.github/workflows/orion-osiris-migration-lane.yml'
  pull_request:
    paths:
      - 'registry/orion-osiris-excavation-migration.yaml'
      - 'tools/validate_orion_osiris_migration_lane.py'
      - '.github/workflows/orion-osiris-migration-lane.yml'

jobs:
  validate-orion-osiris-migration-lane:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Validate Orion OSIRIS migration lane registry
        run: python3 tools/validate_orion_osiris_migration_lane.py
