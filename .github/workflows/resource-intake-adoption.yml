name: resource-intake-adoption

on:
  push:
    paths:
      - registry/resource-intake-adoption.yaml
      - tools/validate_resource_intake_adoption.py
      - tests/fixtures/resource-intake-adoption*.yaml
      - .github/workflows/resource-intake-adoption.yml
  pull_request:
    paths:
      - registry/resource-intake-adoption.yaml
      - tools/validate_resource_intake_adoption.py
      - tests/fixtures/resource-intake-adoption*.yaml
      - .github/workflows/resource-intake-adoption.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pyyaml
      - name: Validate resource intake adoption registry
        run: python3 tools/validate_resource_intake_adoption.py
      - name: Confirm invalid runtime dependency fixture fails
        run: |
          ! python3 tools/validate_resource_intake_adoption.py tests/fixtures/resource-intake-adoption.invalid-runtime-dependency.yaml
