name: service-register

# Observable CI probe: service-register current diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "architecture/service-register/**"
      - "tools/rehydrate_service_register_artifacts.py"
      - "tools/validate_service_register_artifacts.py"
      - "tools/check_service_register_repo_coverage.py"
      - "tools/check_service_dependency_cycles.py"
      - "tools/generate_service_critical_path_report.py"
      - "tools/check_workspace_inventory_binding.py"
      - "tools/check_canonical_repo_mirror_pin.py"
      - "tools/generate_workspace_inventory_sync_report.py"
      - "tools/generate_service_register_drift_report.py"
      - "tools/check_critical_contract_paths.py"
      - "tools/check_contract_target_ledger.py"
      - "tools/check_lampstand_contract_registry.py"
      - "tools/check_mcp_a2a_bootstrap_zero_trust_diff.py"
      - "tools/check_fabric_atlas_model_carry_reconciliation.py"
      - "tools/check_fabric_atlas_model_carry_propagation_plan.py"
      - "tools/check_atlas_bundle_diff_status.py"
      - "tools/check_atlas_readme_extraction_checklist.py"
      - ".github/workflows/service-register.yml"
  push:
    branches: [main]
    paths:
      - "architecture/service-register/**"
      - "tools/rehydrate_service_register_artifacts.py"
      - "tools/validate_service_register_artifacts.py"
      - "tools/check_service_register_repo_coverage.py"
      - "tools/check_service_dependency_cycles.py"
      - "tools/generate_service_critical_path_report.py"
      - "tools/check_workspace_inventory_binding.py"
      - "tools/check_canonical_repo_mirror_pin.py"
      - "tools/generate_workspace_inventory_sync_report.py"
      - "tools/generate_service_register_drift_report.py"
      - "tools/check_critical_contract_paths.py"
      - "tools/check_contract_target_ledger.py"
      - "tools/check_lampstand_contract_registry.py"
      - "tools/check_mcp_a2a_bootstrap_zero_trust_diff.py"
      - "tools/check_fabric_atlas_model_carry_reconciliation.py"
      - "tools/check_fabric_atlas_model_carry_propagation_plan.py"
      - "tools/check_atlas_bundle_diff_status.py"
      - "tools/check_atlas_readme_extraction_checklist.py"
      - ".github/workflows/service-register.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SERVICE_REGISTER_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rehydrate service register artifacts
        run: python3 tools/rehydrate_service_register_artifacts.py
      - name: Validate service register artifacts
        run: python3 tools/validate_service_register_artifacts.py
      - name: Check service register repo coverage
        run: python3 tools/check_service_register_repo_coverage.py
      - name: Diagnostic dependency edge row count
        run: |
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open('architecture/service-register/service-dependency-edges.v0.1.csv', newline='', encoding='utf-8')))
          print(f'DIAG edge_rows={len(rows)} expected=119')
          raise SystemExit(0 if len(rows)==119 else 1)
          PY
      - name: Diagnostic dependency boot-required count
        run: |
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open('architecture/service-register/service-dependency-edges.v0.1.csv', newline='', encoding='utf-8')))
          n=sum(1 for r in rows if str(r.get('required_for_bootstrap','')).strip().lower()=='true')
          print(f'DIAG boot_required={n} expected=28')
          raise SystemExit(0 if n==28 else 1)
          PY
      - name: Diagnostic dependency allowed-cycle count
        run: |
          python3 - <<'PY'
          import csv
          allowed={'allowed-if-optional','allowed-runtime-feedback','allowed-governance-loop'}
          rows=list(csv.DictReader(open('architecture/service-register/service-dependency-edges.v0.1.csv', newline='', encoding='utf-8')))
          n=sum(1 for r in rows if r.get('cycle_policy') in allowed)
          print(f'DIAG allowed_cycle_edges={n} expected=7')
          raise SystemExit(0 if n==7 else 1)
          PY
      - name: Diagnostic dependency enum validity
        run: |
          python3 - <<'PY'
          import csv
          kinds={'depends_on','consumes','emits_to','governs','ui_surface','evidence_feed'}
          modes={'hard','soft','optional-extension','runtime-callback','policy-required','governance-feedback','evaluation-orchestration','evidence-feed','ui-consumes'}
          policies={'forbidden','allowed-if-optional','allowed-runtime-feedback','allowed-governance-loop'}
          rows=list(csv.DictReader(open('architecture/service-register/service-dependency-edges.v0.1.csv', newline='', encoding='utf-8')))
          bad=[]
          for r in rows:
            edge_id=r.get('edge_id','<missing-edge-id>')
            if r.get('edge_kind') not in kinds: bad.append(f'{edge_id}:edge_kind={r.get("edge_kind")}')
            if r.get('dependency_mode') not in modes: bad.append(f'{edge_id}:dependency_mode={r.get("dependency_mode")}')
            if r.get('cycle_policy') not in policies: bad.append(f'{edge_id}:cycle_policy={r.get("cycle_policy")}')
          print(f'DIAG enum_failures={len(bad)} sample={bad[:20]}')
          raise SystemExit(0 if not bad else 1)
          PY
      - name: Diagnostic dependency service references
        run: |
          python3 - <<'PY'
          import csv
          services={r['service_id'] for r in csv.DictReader(open('architecture/service-register/service-architecture-register.v1.0.csv', newline='', encoding='utf-8')) if r.get('service_id')}
          rows=list(csv.DictReader(open('architecture/service-register/service-dependency-edges.v0.1.csv', newline='', encoding='utf-8')))
          missing=[]
          for r in rows:
            edge_id=r.get('edge_id','<missing-edge-id>')
            if r.get('from_service_id') not in services: missing.append(f'{edge_id}:from={r.get("from_service_id")}')
            if r.get('to_service_id') not in services: missing.append(f'{edge_id}:to={r.get("to_service_id")}')
          print(f'DIAG service_reference_failures={len(missing)} sample={missing[:20]}')
          raise SystemExit(0 if not missing else 1)
          PY
      - name: Check service dependency cycles
        run: python3 tools/check_service_dependency_cycles.py
      - name: Generate service critical path report
        run: python3 tools/generate_service_critical_path_report.py
      - name: Check critical contract paths
        run: python3 tools/check_critical_contract_paths.py
      - name: Check contract target ledger
        run: python3 tools/check_contract_target_ledger.py
      - name: Check workspace inventory binding
        run: python3 tools/check_workspace_inventory_binding.py
      - name: Check canonical repo mirror pin
        run: python3 tools/check_canonical_repo_mirror_pin.py
      - name: Check Lampstand contract registry
        run: python3 tools/check_lampstand_contract_registry.py
      - name: Check MCP A2A bootstrap zero-trust diff
        run: python3 tools/check_mcp_a2a_bootstrap_zero_trust_diff.py
      - name: Check Fabric Atlas Model Carry reconciliation
        run: python3 tools/check_fabric_atlas_model_carry_reconciliation.py
      - name: Check Fabric Atlas Model Carry propagation plan
        run: python3 tools/check_fabric_atlas_model_carry_propagation_plan.py
      - name: Check Atlas bundle diff status
        run: python3 tools/check_atlas_bundle_diff_status.py
      - name: Check Atlas README extraction checklist
        run: python3 tools/check_atlas_readme_extraction_checklist.py
      - name: Generate workspace inventory sync report
        run: python3 tools/generate_workspace_inventory_sync_report.py
      - name: Check workspace inventory sync report freshness
        run: python3 tools/generate_workspace_inventory_sync_report.py --check
      - name: Generate service register drift report
        run: python3 tools/generate_service_register_drift_report.py
      - name: Check service register drift report freshness
        run: python3 tools/generate_service_register_drift_report.py --check
