name: SVF Cross-Repo Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'registry/sovereign-validation-fabric.yaml'
      - 'tools/svf_runner.py'
      - 'tools/validate_svf_registry.py'
      - '.github/workflows/svf-cross-repo-validation.yml'

jobs:
  validate-svf-estate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: superconscious
            repo: SocioProphet/superconscious
            command: make validate-svf-validation-history
          - id: model-router
            repo: SocioProphet/model-router
            command: make validate-svf-receipt-state-routing
          - id: prophet-platform
            repo: SocioProphet/prophet-platform
            command: make validate-svf-agent-contract
          - id: sourceos-spec
            repo: SourceOS-Linux/sourceos-spec
            command: make validate-svf-contracts
          - id: ontogenesis
            repo: SocioProphet/ontogenesis
            command: make venv && make deps && make svf
          - id: scope-d
            repo: SocioProphet/SCOPE-D
            command: npm ci || npm install; npm run validate:svf
          - id: sociosphere
            repo: SocioProphet/sociosphere
            command: make svf-workspace-validate
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: target
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SVF validation lane
        working-directory: target
        run: ${{ matrix.command }}
