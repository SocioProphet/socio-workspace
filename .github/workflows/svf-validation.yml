name: SVF Validation

on:
  push:
    branches: [main]
    paths:
      - 'tools/check_svf_workspace_state.py'
      - 'tools/validate_environment_sandbox_profiles.py'
      - 'registry/**'
      - 'spec/**'
      - 'fixtures/**'
      - '.github/workflows/svf-validation.yml'
  pull_request:
    paths:
      - 'tools/check_svf_workspace_state.py'
      - 'tools/validate_environment_sandbox_profiles.py'
      - 'registry/**'
      - 'spec/**'
      - 'fixtures/**'
      - '.github/workflows/svf-validation.yml'
  workflow_dispatch:
jobs:
  sociosphere-svf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Sociosphere SVF workspace
        run: make svf-workspace-validate
      - name: Validate Sociosphere SVF workspace state
        run: |
          python3 -m pip install --user pyyaml >/dev/null
          python3 tools/check_svf_workspace_state.py
      - name: Validate environment sandbox profiles
        run: |
          python3 -m pip install --user pyyaml >/dev/null
          python3 tools/validate_environment_sandbox_profiles.py
