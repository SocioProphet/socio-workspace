name: ui-check

on:
  push:
    paths:
      - 'client-vue/**'
      - 'ui/**'
      - '**/*.vue'
      - '**/*.ts'
      - '**/*.tsx'
      - '.github/workflows/ui-check.yml'
  pull_request:
    paths:
      - 'client-vue/**'
      - 'ui/**'
      - '**/*.vue'
      - '**/*.ts'
      - '**/*.tsx'
      - '.github/workflows/ui-check.yml'
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: UI install
        run: make ui-install

      - name: UI check
        run: make ui-check
