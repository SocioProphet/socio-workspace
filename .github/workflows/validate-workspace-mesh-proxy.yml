name: Validate Workspace Mesh Proxy

on:
  pull_request:
    paths:
      - 'GNUmakefile'
      - 'tools/validate_workspace_mesh_proxy.py'
      - 'docs/operations/workspace-mesh-proxy.md'
      - '.github/workflows/validate-workspace-mesh-proxy.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'GNUmakefile'
      - 'tools/validate_workspace_mesh_proxy.py'
      - 'docs/operations/workspace-mesh-proxy.md'
      - '.github/workflows/validate-workspace-mesh-proxy.yml'
  workflow_dispatch:

jobs:
  validate-workspace-mesh-proxy:
    name: Validate Workspace Mesh Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate proxy surface
        run: python3 tools/validate_workspace_mesh_proxy.py
