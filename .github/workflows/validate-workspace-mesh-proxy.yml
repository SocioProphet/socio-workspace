name: Validate Workspace Mesh Topology

on:
  pull_request:
    paths:
      - 'GNUmakefile'
      - 'workspace-mesh-gates.mk'
      - 'tools/validate_workspace_mesh_proxy.py'
      - 'tools/validate_workspace_mesh_release_readiness.py'
      - 'tools/validate_workspace_mesh_gate1_artifact_review.py'
      - 'docs/operations/workspace-mesh-proxy.md'
      - 'docs/operations/workspace-mesh-release-readiness.md'
      - 'docs/operations/workspace-mesh-gate1-generated-artifact-review-template.md'
      - 'docs/operations/workspace-mesh-gate1-status.md'
      - 'registry/workspace-mesh-release-readiness.v0.json'
      - 'registry/workspace-mesh-gate1-generated-artifact-review.v0.json'
      - 'registry/workspace-mesh-gate1-status.v0.json'
      - '.github/workflows/validate-workspace-mesh-proxy.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'GNUmakefile'
      - 'workspace-mesh-gates.mk'
      - 'tools/validate_workspace_mesh_proxy.py'
      - 'tools/validate_workspace_mesh_release_readiness.py'
      - 'tools/validate_workspace_mesh_gate1_artifact_review.py'
      - 'docs/operations/workspace-mesh-proxy.md'
      - 'docs/operations/workspace-mesh-release-readiness.md'
      - 'docs/operations/workspace-mesh-gate1-generated-artifact-review-template.md'
      - 'docs/operations/workspace-mesh-gate1-status.md'
      - 'registry/workspace-mesh-release-readiness.v0.json'
      - 'registry/workspace-mesh-gate1-generated-artifact-review.v0.json'
      - 'registry/workspace-mesh-gate1-status.v0.json'
      - '.github/workflows/validate-workspace-mesh-proxy.yml'
  workflow_dispatch:

jobs:
  validate-workspace-mesh-topology:
    name: Validate Workspace Mesh Topology
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate proxy surface
        run: python3 tools/validate_workspace_mesh_proxy.py

      - name: Validate release readiness
        run: python3 tools/validate_workspace_mesh_release_readiness.py

      - name: Validate Gate 1 artifact review
        run: python3 tools/validate_workspace_mesh_gate1_artifact_review.py
