name: validate

on:
  push:
    paths:
      - 'registry/**'
      - 'standards/**'
      - 'spec/**'
      - 'manifest/**'
      - 'schemas/**'
      - 'tools/check_*.py'
      - 'tools/check_*.sh'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'registry/**'
      - 'standards/**'
      - 'spec/**'
      - 'manifest/**'
      - 'schemas/**'
      - 'tools/check_*.py'
      - 'tools/check_*.sh'
      - '.github/workflows/validate.yml'
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check out agent-registry (gbrg governance gate's authorize.py dependency)
        uses: actions/checkout@v4
        with:
          repository: SocioProphet/agent-registry
          path: agent-registry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/ui-workbench/package-lock.json

      - name: Runner smoke test (list)
        run: python tools/runner/runner.py list

      - name: Runner check-manifest
        run: python tools/runner/runner.py check-manifest

      - name: Runner lock-verify
        run: python tools/runner/runner.py lock-verify

      - name: Runner smoke test (list)
        run: python tools/runner/runner.py list

      - name: Lock verify
        run: python tools/runner/runner.py lock-verify

      - name: Inventory
        run: python tools/runner/runner.py inventory

      - name: Topology check
        run: python tools/check_topology.py

      - name: Repository hygiene check
        run: bash tools/check_hygiene.sh

      - name: Source exposure check
        run: python tools/check_source_exposure.py

      - name: UI install
        run: make ui-install

      - name: UI check
        run: make ui-check

      - name: Standards validation
        run: make validate-standards

      - name: Python tests
        run: pytest -q

  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Registry validate (ontology + cycles)
        run: make registry-validate

  # The `validate` job above runs `make validate-standards`, which is only the FIRST
  # prerequisite of the `validate` aggregate. Nothing ran the aggregate itself, so four
  # of its targets stayed broken from the commit that introduced them. This job runs it.
  validate-aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # `validate` is a plain prerequisite list, so a bare `make validate` stops at the
      # first failing target and hides every later one -- that is how the four broken
      # targets stayed invisible behind each other. `-k` runs every target and still
      # exits non-zero if any failed, so one red target cannot mask the rest.
      - name: Validate aggregate (all targets, keep-going)
        run: make -k validate

      # The SVF smoke targets regenerate the committed artifacts/svf fixtures. They pin
      # svf_runner's clock (SVF_SOURCE_DATE_EPOCH in the Makefile), so a correct run
      # reproduces those files byte-for-byte and the tree stays clean. A non-empty diff
      # -- or an untracked artifact -- means the generator output drifted from what is
      # committed, which is a real regression: fail and show it.
      - name: Assert SVF fixtures are reproducible (clean tree)
        run: |
          if [ -n "$(git status --porcelain -- artifacts/svf)" ]; then
            echo "::error::make validate changed committed SVF fixtures -- regenerate with 'make svf-workspace-validate' and commit, or investigate the generator drift."
            git status --porcelain -- artifacts/svf
            git --no-pager diff -- artifacts/svf
            exit 1
          fi
          echo "OK: SVF fixtures reproduced byte-for-byte"
