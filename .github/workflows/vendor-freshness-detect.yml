# vendor-freshness-detect — the detector (W12.2).
#
# The register that W12.1 seeded records what upstream looked like when a human last
# looked. This is the machine that looks, so that "a human last looked" stops being
# the mechanism. It runs daily, and on demand when an upstream cuts a release.
#
# It does TWO things, and it is important that they are separate:
#
#  1. Refreshes the observation IN THIS REPO and opens a PR here. That PR is the
#     anti-rot ratchet: policy.tier_observation_max_age_days gives foundation sources
#     30 days, so if this job stops running, the vendor-freshness gate goes red on
#     day 31 and says why. The automation cannot fail silently, because its silence
#     IS the failure signal.
#
#  2. Emits one re-vendor PLAN per stale artifact — an EffectRequest carrying the
#     whole evidence bundle — and publishes it as an artifact. The CONSUMER repo's
#     executor picks it up and opens the re-vendor PR there.
#
# ── Why this workflow does not open the re-vendor PR itself ─────────────────────
# It cannot, without a credential this estate has decided not to have. sociosphere's
# GITHUB_TOKEN is scoped to sociosphere; opening a PR in prophet-platform needs a
# cross-repo PAT or a GitHub App installation token. Both are new long-lived secrets.
# So the direction is inverted: the consumer PULLS the plan and opens the PR with its
# OWN token, in its own CI, against its own test suite. See
# prophet-platform/.github/workflows/revendor-vendored-artifact.yml.
#
# That is not a workaround. The re-vendor work — build, pack, assert the marker
# inside the dist, move the floor, run the suite, verify the sealed receipts — has to
# happen in the consumer's toolchain anyway. A cross-repo token would have bought the
# ability to push a branch, not the ability to verify it.
name: vendor-freshness-detect

on:
  schedule:
    # Daily, early UTC. Frequency is a floor on how long a release can be invisible;
    # 24h against the five-release, multi-week gap this replaces.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      open_pr:
        description: 'Open the register-refresh PR (off = observe and report only)'
        type: boolean
        default: true
  repository_dispatch:
    # An upstream that has just cut a release can trigger this directly rather than
    # waiting for the next cron. Contract: {"event_type": "upstream-release",
    # "client_payload": {"source_id": "hellgraph-engine", "version": "0.4.46"}}.
    # The emitter side lives in the upstream repo and is NOT shipped here — hellgraph
    # is a different lane. Until it exists, the schedule is what closes the gap, and
    # this trigger is dispatchable by hand today.
    types: [upstream-release]

permissions:
  contents: read

concurrency:
  group: vendor-freshness-detect
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the register-refresh branch
      pull-requests: write   # open the PR for it
      actions: write         # dispatch git-ops-standards.yml onto our own branch
      statuses: write        # publish gate / check, since our PR's pull_request
                              # event never triggers it (GITHUB_TOKEN no-recursion)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pyyaml

      # git ls-remote against public HTTPS URLs. That is the entire network surface:
      # no API token, no registry credential, no new secret.
      - name: Observe upstream and recompute
        id: detect
        run: |
          set -euo pipefail
          python3 tools/detect_vendor_freshness.py \
            --write-register \
            --propose-disposition \
            --emit-plans plans \
            --observations-out plans/observations.json \
            --summary detect-summary.md \
            ${{ github.event.client_payload.source_id && format('--source {0}', github.event.client_payload.source_id) || '' }} \
            | tee detect.log
          echo "plans=$(find plans -name '*.json' ! -name observations.json | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- registry/vendor-freshness.yaml; then
            echo "register_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "register_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The refreshed register must pass the gate before it is proposed. Proposing a
      # change that fails the gate would hand a human a red build to repair by hand,
      # which is the labour this whole plane exists to delete.
      - name: The refreshed register must pass its own gate
        run: python3 tools/validate_vendor_freshness.py --skip-disk

      - name: Publish summary
        run: cat detect-summary.md >> "$GITHUB_STEP_SUMMARY"

      # The plans are the interface to the consumer repos. Retained long enough for a
      # consumer's scheduled run to pick one up without depending on timing.
      - name: Upload re-vendor plans
        uses: actions/upload-artifact@v4
        with:
          name: vendor-revendor-plans
          path: plans/
          retention-days: 30
          if-no-files-found: ignore

      - name: Open the register-refresh PR
        id: open_pr
        if: steps.detect.outputs.register_changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.open_pr)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="vendor-freshness/observe-$(date -u +%Y%m%d)"
          git config user.name "vendor-freshness-detect[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One branch per day, force-updated: a re-run must converge on the same PR
          # rather than opening a second one for the same observation.
          git checkout -B "$BRANCH"
          git add registry/vendor-freshness.yaml
          git commit -m "vendor-freshness: refresh upstream observation $(date -u +%Y-%m-%d)"
          git push --force origin "$BRANCH"
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "vendor-freshness: refresh upstream observation ($(date -u +%Y-%m-%d))" \
              --body-file detect-summary.md
            PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          else
            gh pr edit "$BRANCH" --body-file detect-summary.md
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      # ── Satisfy the required 'gate / check' context for this bot-authored PR ──────
      # This PR is opened with GITHUB_TOKEN, so its own pull_request-triggered run of
      # git-ops-standards.yml never fires -- the no-recursion rule. Dispatch it
      # explicitly with real PR context (git-ops-standards PR #12 taught it to accept
      # that), wait for the real outcome, then publish the commit status directly.
      # Fail-closed by construction: publish `pending` before dispatching, and nothing
      # downgrades that to `success` except a measured green run -- if this job dies
      # partway, the PR is left visibly blocked, never invisibly blocked.
      - name: Satisfy gate / check for this bot-authored PR
        if: steps.open_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          BRANCH: ${{ steps.open_pr.outputs.branch }}
          HEAD_SHA: ${{ steps.open_pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.open_pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          post_status() {   # $1=state $2=description $3=target_url
            gh api -X POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
              -f state="$1" -f context='gate / check' \
              -f description="$(printf '%.140s' "$2")" \
              -f target_url="${3:-https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}}" >/dev/null
          }
          post_status pending "gate dispatched onto ${BRANCH}"

          dispatched=""
          for attempt in 1 2 3; do
            if gh workflow run git-ops-standards.yml --ref "$BRANCH" \
                 -f pr_number="$PR_NUMBER" -f base_sha="$BASE_SHA" -f head_sha="$HEAD_SHA"; then
              dispatched=1; echo "dispatched gate onto $BRANCH (attempt $attempt)"; break
            fi
            echo "dispatch attempt $attempt failed; retrying in 10s"; sleep 10
          done
          if [ -z "$dispatched" ]; then
            post_status failure "could not dispatch git-ops-standards after 3 attempts"
            echo "::error::could not dispatch git-ops-standards for $BRANCH"; exit 1
          fi

          RUN_ID=""
          for attempt in $(seq 1 20); do
            api_err=$(mktemp)
            if RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/git-ops-standards.yml/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=1" \
                          --jq '.workflow_runs[0].id // empty' 2>"$api_err"); then
              rm -f "$api_err"
              [ -n "$RUN_ID" ] && break
              echo "run not yet visible (attempt $attempt) -- eventual consistency, retrying"
            else
              echo "::warning::gh api failed on attempt $attempt: $(head -3 "$api_err")"
              rm -f "$api_err"
              if [ "$attempt" -ge 3 ]; then
                post_status failure "querying workflow runs failed (see this run's log)"
                echo "::error::gh api failed 3 times -- refusing to certify silently"; exit 1
              fi
            fi
            sleep 15
          done
          if [ -z "$RUN_ID" ]; then
            post_status failure "gate run never appeared for ${BRANCH}"
            echo "::error::dispatched run never materialised"; exit 1
          fi
          DIAG_URL="https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}"
          post_status pending "gate run ${RUN_ID} dispatched -- awaiting outcome"

          if ! timeout 900 gh run watch "${RUN_ID}" --interval 10 >/dev/null 2>&1; then
            STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" --jq '.status' 2>/dev/null || echo "")
            if [ "$STATUS" != "completed" ]; then
              post_status failure "gate run ${RUN_ID} did not complete within the budget" "$DIAG_URL"
              echo "::error::timed out waiting for run ${RUN_ID} (status=${STATUS:-unknown})"; exit 1
            fi
          fi

          BAD=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" --paginate \
                  --jq '.jobs[] | select(.conclusion != "success") | .name' 2>/dev/null || echo "API_READ_FAILED")
          if [ "$BAD" = "API_READ_FAILED" ]; then
            post_status failure "could not read job results for run ${RUN_ID}" "$DIAG_URL"
            echo "::error::job-list read failed -- refusing to certify"; exit 1
          fi
          if [ -n "$BAD" ]; then
            post_status failure "gate job(s) not successful: $(printf '%s\n' "$BAD" | head -3 | tr '\n' ',' | sed 's/,$//')" "$DIAG_URL"
            echo "::error::gate did not pass"; exit 1
          fi
          post_status success "git-ops-standards gate passed for ${HEAD_SHA}" "$DIAG_URL"
          echo "gate / check is green for ${HEAD_SHA}"
