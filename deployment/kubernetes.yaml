---
# Kubernetes deployment manifest for the Phase A automation framework.
# Apply with:  kubectl apply -f deployment/kubernetes.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: sociosphere-automation

---
# ConfigMap – registry YAML files are mounted as files inside the pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: sociosphere-automation
data:
  # Override / extend these entries with your real registry files.
  canonical-repos.yaml: |
    # placeholder — mount your real canonical-repos.yaml here
    repos: []

---
# Secret – GitHub webhook secret.
# In production, populate via:
#   kubectl create secret generic github-secrets \
#     --from-literal=webhook-secret=<YOUR_SECRET> \
#     --from-literal=github-token=<YOUR_TOKEN> \
#     -n sociosphere-automation
apiVersion: v1
kind: Secret
metadata:
  name: github-secrets
  namespace: sociosphere-automation
type: Opaque
data:
  # base64-encoded placeholders – replace before deploying
  webhook-secret: ""
  github-token: ""

---
# Secret – Crystal Atlas graph endpoint credentials. The scheduler records graph-upserts
# with NO credentials; only the crystal-atlas-poster CronJob (below) holds this token and
# the endpoint URL, so the daemon can never reach the shared graph directly. Leave the
# endpoint blank to disable POSTing entirely — the poster then no-ops (never a failure).
#   kubectl create secret generic crystal-atlas-secrets \
#     --from-literal=graph-upsert-url=<URL> \
#     --from-literal=token=<TOKEN> \
#     -n sociosphere-automation
apiVersion: v1
kind: Secret
metadata:
  name: crystal-atlas-secrets
  namespace: sociosphere-automation
type: Opaque
data:
  # base64-encoded placeholders – replace before deploying (blank url = poster disabled)
  graph-upsert-url: ""
  token: ""

---
# PersistentVolumeClaim – APScheduler job store.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scheduler-jobstore
  namespace: sociosphere-automation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# PersistentVolumeClaim – SHARED self-heal state (ReadWriteMany).
# This is the wire the earlier NOTEs called for. The webhook pods (event producers),
# the scheduler (consumer + decision/proposal writer), and the proposal-opener CronJob
# (proposal reader) all mount THIS volume at /app/state and set SOCIOSPHERE_STATE_DIR to
# it — so beacons, decisions, proposals and the heartbeat are one shared queue across pods
# and nodes. Without it, webhook events landed in a per-pod temp dir the scheduler never saw.
#
# REQUIRES a StorageClass that supports ReadWriteMany (NFS / CephFS / EFS / Filestore /
# Azure Files). If your cluster has none, use a single-node affinity for these pods, or move
# the queue to a Redis/object-store backend (see automation/durable_queue.py scope notes).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: automation-state
  namespace: sociosphere-automation
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi

---
# Service – exposes the webhook handler on port 5000.
apiVersion: v1
kind: Service
metadata:
  name: webhooks
  namespace: sociosphere-automation
  labels:
    app: webhooks
spec:
  selector:
    app: webhooks
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP

---
# Deployment – webhook handler (Flask).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhooks
  namespace: sociosphere-automation
  labels:
    app: webhooks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webhooks
  template:
    metadata:
      labels:
        app: webhooks
    spec:
      initContainers:
        - name: auto-merge
          image: registry.socioprophet.ai/sociosphere-automation:latest
          command:
            - python
            - -c
            - |
              from automation.auto_merge_handler import AutoMergeHandler
              import os, github
              gh = github.Github(os.environ["GITHUB_TOKEN"])
              handler = AutoMergeHandler(gh, "SocioProphet/sociosphere")
              handler.run()
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-secrets
                  key: github-token
      containers:
        - name: webhooks
          image: registry.socioprophet.ai/sociosphere-automation:latest
          command: ["python", "-m", "automation.webhooks"]
          ports:
            - containerPort: 5000
          env:
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-secrets
                  key: webhook-secret
            # Produce webhook events onto the SHARED state volume so the scheduler pod
            # actually drains them. Previously unset -> events went to a per-pod temp dir.
            - name: SOCIOSPHERE_STATE_DIR
              value: /app/state
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: registry
              mountPath: /app/registry
            - name: automation-state
              mountPath: /app/state
      volumes:
        - name: registry
          configMap:
            name: registry-config
        - name: automation-state
          persistentVolumeClaim:
            claimName: automation-state

---
# Deployment – APScheduler (single replica, no scaling).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: sociosphere-automation
  labels:
    app: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: registry.socioprophet.ai/sociosphere-automation:latest
          command: ["python", "-m", "automation.scheduler"]
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-secrets
                  key: github-token
            # All self-heal state (heartbeat, beacons, decisions, proposals) on the SHARED
            # RWX volume so webhook-produced events reach this daemon and the proposal-opener
            # CronJob sees the proposals it writes. The liveness probe reads the heartbeat
            # from here in-pod.
            - name: SOCIOSPHERE_STATE_DIR
              value: /app/state
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          # Honest liveness: fails when the daemon stops writing its heartbeat.
          # Replaces `python -c "import automation.scheduler; print('ok')"`, which
          # passed whenever the module merely imported (green health, dead daemon).
          livenessProbe:
            exec:
              command: ["python", "-m", "automation.healthz"]
            initialDelaySeconds: 30
            periodSeconds: 60
          volumeMounts:
            - name: jobstore
              mountPath: /app/jobstore
            - name: registry
              mountPath: /app/registry
            - name: automation-state
              mountPath: /app/state
      volumes:
        - name: jobstore
          persistentVolumeClaim:
            claimName: scheduler-jobstore
        - name: registry
          configMap:
            name: registry-config
        - name: automation-state
          persistentVolumeClaim:
            claimName: automation-state
---
# CronJob – proposal opener. The reasoned responder records fix proposals to the
# scheduler's state volume with NO credentials. This job runs on a schedule WITH a
# GitHub token, drains those proposals, and opens each as a human-reviewable PR
# (automation.open_recorded_proposals -> pr_opener.open_pr). It only ever OPENS a
# PR — never merges — so every self-healed change still passes human review and the
# CI-workflow / token-change review guardrail is preserved.
#
# It mounts the SHARED RWX automation-state volume at /app/state (same as the scheduler),
# so it sees exactly the proposals the daemon wrote — no node-affinity hack required.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: proposal-opener
  namespace: sociosphere-automation
  labels:
    app: proposal-opener
spec:
  schedule: "17 */2 * * *"   # every 2h, offset off the hour
  concurrencyPolicy: Forbid  # never two openers racing the same proposals
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0          # the drainer does its own bounded retry + dead-letter
      template:
        metadata:
          labels:
            app: proposal-opener
        spec:
          restartPolicy: Never
          containers:
            - name: proposal-opener
              image: registry.socioprophet.ai/sociosphere-automation:latest
              command: ["python", "-m", "automation.open_recorded_proposals"]
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-secrets
                      key: github-token
                - name: SOCIOSPHERE_STATE_DIR
                  value: /app/state
                - name: GIT_AUTHOR_NAME
                  value: sociosphere-self-heal
                - name: GIT_AUTHOR_EMAIL
                  value: self-heal@sociosphere.local
                - name: GIT_COMMITTER_NAME
                  value: sociosphere-self-heal
                - name: GIT_COMMITTER_EMAIL
                  value: self-heal@sociosphere.local
              resources:
                requests:
                  cpu: "250m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
              volumeMounts:
                - name: automation-state
                  mountPath: /app/state
          volumes:
            - name: automation-state
              persistentVolumeClaim:
                claimName: automation-state

---
# CronJob – Crystal Atlas graph-upsert poster. The scheduler records each self-heal
# decision as a graph-upsert-request.v0 (claim + evidence) to the shared state volume
# with NO credentials (crystal_atlas.emit_graph_upsert). This job runs on a schedule
# WITH the graph token, drains those upserts, and POSTs each to the shared MLN ground
# network (automation.post_graph_upserts -> Crystal Atlas graph-upsert endpoint). Bounded
# retry + dead-letter — never silent infinite retry. If the endpoint secret is blank the
# job no-ops (self-heal keeps working; nothing is posted). Same produce/deliver split and
# SHARED RWX state mount as the proposal-opener, so it drains exactly what the daemon wrote.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crystal-atlas-poster
  namespace: sociosphere-automation
  labels:
    app: crystal-atlas-poster
spec:
  schedule: "31 * * * *"     # hourly, offset off the hour
  concurrencyPolicy: Forbid  # never two posters racing the same upserts
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0          # the drainer does its own bounded retry + dead-letter
      template:
        metadata:
          labels:
            app: crystal-atlas-poster
        spec:
          restartPolicy: Never
          containers:
            - name: crystal-atlas-poster
              image: registry.socioprophet.ai/sociosphere-automation:latest
              command: ["python", "-m", "automation.post_graph_upserts"]
              env:
                - name: CRYSTAL_ATLAS_GRAPH_UPSERT_URL
                  valueFrom:
                    secretKeyRef:
                      name: crystal-atlas-secrets
                      key: graph-upsert-url
                      optional: true
                - name: CRYSTAL_ATLAS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: crystal-atlas-secrets
                      key: token
                      optional: true
                - name: SOCIOSPHERE_STATE_DIR
                  value: /app/state
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: automation-state
                  mountPath: /app/state
          volumes:
            - name: automation-state
              persistentVolumeClaim:
                claimName: automation-state
