# gbrg-analyze — END-TO-END GBRG pipeline (the first demoable artifact).
#
# Composes the three GBRG feeders into one flow:
#   gbrg-parser (parse) -> gbrg-core write path (ingest into HellGraph Store)
#   -> freeze() -> gbrg-core scoring (emit_proof_artifact) -> ProofArtifacts.
#
# It depends on BOTH sibling crates. No new model is defined here: gbrg-parser
# already depends on gbrg-core, and gbrg-analyze depends on both — no dependency
# cycle because gbrg-core depends on neither (only on hg_analytics, consume-only).
[package]
name = "gbrg-analyze"
version = "0.1.0"
edition = "2021"
description = "End-to-end GBRG pipeline: parse a file, ingest into HellGraph, score, emit ProofArtifacts."
license = "MIT OR Apache-2.0"

[dependencies]
# The core model + the write path (write_cell/write_edge) + the scoring layer
# (ScoringConfig, emit_proof_artifact, BlastRadiusProofArtifact).
gbrg-core = { path = "../gbrg-core" }
# The tree-sitter parser producing SemanticCells + GraphEdges from real source.
gbrg-parser = { path = "../gbrg-parser" }
# The frozen index + Store come from hellgraph's analytics crate (consume-only).
hg_analytics = { path = "../../../../hellgraph-rust/crates/hg_analytics" }
# Pretty-print the ProofArtifacts as JSON on the CLI (MIT OR Apache-2.0).
serde_json = "1"

[[bin]]
name = "gbrg-analyze"
path = "src/main.rs"

[lib]
name = "gbrg_analyze"
path = "src/lib.rs"
