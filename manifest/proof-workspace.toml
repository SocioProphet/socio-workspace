[proof_workspace]
name = "sociosphere-proof-apparatus"
version = "0.1"
controller_repo = "SocioProphet/sociosphere"
controller_protocol = "protocol/proof-apparatus-workspace/v0"
extends = ["protocol/emvi-proof-slice/v0", "standards/qes"]
ledger_mode = "required"
attestation_required = true
default_claim_state = "diagnosed"
default_new_synthesis_state = "speculative"
claim_schema = "standards/proof-apparatus/claim-ledger.schema.json"
proof_adapter_schema = "standards/proof-apparatus/proof-adapter.schema.json"
pfk_stack_integration_map = "protocol/proof-apparatus-workspace/v0/pfk-stack-integration-map.md"
repo_role_catalog = "catalog/proof-repo-roles.yaml"

[proof_workspace.pfk_authority]
repo = "SocioProphet/Heller-Godel"
path = "proof_fabric_kernel/"
commit = "988307215ad38ccb16514311222184a1b757752b"
dependency_form = "PFK authority: SocioProphet/Heller-Godel/proof_fabric_kernel @ 988307215ad38ccb16514311222184a1b757752b"
schema_catalog = "proof_fabric_kernel/docs/SchemaCatalog_v1.md"
consumer_contract = "proof_fabric_kernel/docs/ClayProgram_PFK_ConsumerContract_v0.md"
schemas = [
  "PFK-SCHEMA-001",
  "PFK-SCHEMA-002",
  "PFK-SCHEMA-003",
  "PFK-SCHEMA-004"
]
floating_main_allowed = false
schema_validity_is_content_validity = false
receipts_are_theorem_evidence = false

[proof_workspace.policy]
promotion_requires = [
  "claim_boundary",
  "non_claims",
  "artifact_digests",
  "gate_status",
  "severity_delta",
  "controller_decision",
  "pfk_dependency_pin",
  "anti_seed_acknowledgement"
]
failure_wall_required_when_blocked = true
prose_only_promotion_allowed = false
speculation_can_promote_to_theorem = false
pfk_envelope_validity_promotes_claim = false
memory_context_promotes_claim = false

[proof_workspace.evidence]
severity_levels = ["E0", "E1", "E2", "E3", "E4", "E5", "E6", "E7"]
failure_walls = [
  "certificate_wall",
  "counting_wall",
  "shell_map_preservation_wall",
  "quotient_wall",
  "preimage_wall",
  "continuum_reconstruction_wall",
  "integer_chern_wall",
  "height_bound_wall",
  "set_theoretic_wall",
  "combinatorial_extremal_wall"
]

[[repos]]
name = "Heller-Godel"
role = "metatheory-engine"
domain = "proof-boundary-incompleteness-formal-governance"
url = "https://github.com/SocioProphet/Heller-Godel"
ref = "main"
local_path = "proof/heller-godel"
pfk_authority = true
pfk_consumer_maturity = "authority"
owned_gates = [
  "claim-boundary",
  "non-claim",
  "formalization-readiness",
  "incompleteness-boundary",
  "proof-ledger-consistency",
  "pfk-schema-catalog",
