# agent-prompt-catalog — raw operator prompts + the agent's refined interpretation,
# with review-flags. Purpose: make the prompt→work mapping auditable, surface prompts
# that produced disproportionate work (delegation risk), and surface prompts reused
# often enough to deserve promotion into a named, parameterized standard operating
# procedure (SOP) / skill.
#
# review_flag fires when EITHER:
#   (a) work_footprint is HIGH relative to prompt_specificity  ("produced too much work"),
#       i.e. a terse/broad prompt that delegated a large, branching body of work; OR
#   (b) reuse_count > 3 within a domain, where reuse is measured by a learned
#       vector-similarity threshold over prompt embeddings, bounded to the same
#       `domain` (so cross-domain lookalikes don't collide).
# (b) requires the similarity tool + cross-session history; within THIS session all
# reuse_counts are 1, so only (a) fires here. The tool is specified in
# tools/flag_prompt_catalog.py (TODO) — this file is the seed corpus.
version: "0.1.0"
kind: AgentPromptCatalog
session: ee5de7fc-a3e0-4a83-875e-609cc25ade41
captured: 2026-08-02
domains: [org-projects, org-model, board-parity, standards-loop, meta-governance]

schema:
  id: sequential within session
  raw: verbatim operator prompt (secrets redacted)
  refined: the agent's operative interpretation actually executed
  domain: one of `domains`
  work_footprint: light | medium | high | very-high  (artifacts/PRs/tool-calls produced)
  prompt_specificity: low | medium | high  (how much the prompt constrained the work)
  reuse_count: similar prompts seen (this session; cross-session via tool)
  produced: key outputs
  review_flag: {flag: bool, reason: str}

