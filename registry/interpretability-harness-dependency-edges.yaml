# Interpretability harness dependency edges
#
# Additive edge pack corresponding to registry/dependency-graph.yaml without
# rewriting the large aggregate graph file.

schema_version: "1.0.0"
status: active
updated_at: "2026-05-13"
edge_pack_id: interpretability-harness.dependency_edges

edges:
  - from: superconscious
    to: ProCybernetica
    type: governance_doctrine_reference
    state: active
    lane: interpretability-harness
    comment: "Superconscious interpretability harness release bundles consume ProCybernetica Tier 2 composition and interpretability-release governance doctrine."

  - from: sociosphere
    to: superconscious
    type: doctrine_owner_reference
    state: active
    lane: interpretability-harness
    comment: "SocioSphere records Superconscious as harness doctrine/schema/checker owner; it does not replace that ownership."

  - from: superconscious
    to: sourceos-spec
    type: schema_promotion_path
    state: pre_promotion
    lane: interpretability-harness
    comment: "Provider-boundary, source-lock, feature-entry, and intervention schemas promote only after repo-local fixture stabilization and sourceos-spec review."

  - from: superconscious
    to: agentplane
    type: future_runtime_evidence_integration
    state: deferred
    lane: interpretability-harness
    comment: "Runtime execution and replay evidence are deferred to AgentPlane; current harness registration is schema/fixture/doctrine only."

  - from: superconscious
    to: policy-fabric
    type: future_policy_decision_integration
    state: deferred
    lane: interpretability-harness
    comment: "Future steering or provider-side controls require Policy Fabric admission; no runtime authority is granted by this registration."

  - from: superconscious
    to: ontogenesis
    type: future_ontology_promotion_path
    state: deferred
    lane: interpretability-harness
    comment: "Stable interpretability harness vocabulary may promote to Ontogenesis after v0.1 terms stop changing."

  # ── Executor edges (added 2026-08-04) ──────────────────────────────────────
  # These were the missing half of the lane. The rig declared its dependencies
  # inside its own capd/impair-rig.capd.json, which nothing outside that repo
  # reads -- so the graph could not see that continuum-local and mesh-plane had
  # gained a consumer, and a breaking change to either would not have listed
  # noetica-impair as affected.

  - from: noetica-impair
    to: superconscious
    type: schema_conformance
    state: active
    lane: interpretability-harness
    comment: "noetica-impair validates emitted fragments against superconscious schemas/interpretability/; superconscious remains schema owner and never resolves the hashes it binds."

  - from: noetica-impair
    to: Noetica
    type: fragment_emission
    state: active
    lane: interpretability-harness
    comment: "The rig emits content-addressed fragments that Noetica ingests and renders as the impairment trail; Noetica verifies the receipt chain on read."

  - from: Noetica
    to: superconscious
    type: schema_vendoring
    state: active
    lane: interpretability-harness
    comment: "Noetica vendors superconscious interpretability, lawful-learning and composition schemas with a sha256-per-file manifest; the vendored copy is authority and upstream is used only to detect drift."

  - from: noetica-impair
    to: sourceos-continuum
    type: capability_composition
    state: active
    lane: interpretability-harness
    comment: "capd/impair-rig.capd.json composes_with caps.infra.paas.continuum-local@0.1.0; the rig runs as the same Job on a local kind/k3s cluster or the cloud twin, differing only by kube context."

  - from: noetica-impair
    to: prophet-platform
    type: image_build
    state: active
    lane: interpretability-harness
    comment: "prophet-platform builds and publishes the noetica-impair and noetica-impair-cpu images via its images.yml matrix; the rig itself never builds them."

  - from: noetica-impair
    to: ProCybernetica
    type: governance_doctrine_reference
    state: active
    lane: interpretability-harness
    comment: "Claim tags (M/T/S/E/G), circuit registry entries and forbidden-circuit enforcement follow ProCybernetica lawful-learning doctrine; the rig emits claims as 'captured' and may never self-promote."

non_claims:
  - does_not_create_runtime_dependency
  - does_not_promote_schemas_to_sourceos_spec
  - does_not_claim_agentplane_runtime_integration
  - does_not_claim_policy_fabric_admission_integration
  - does_not_claim_ontogenesis_vocabulary_promotion
  - does_not_change_dependency_graph_aggregate
