apiVersion: sociosphere.socioprophet.io/v1alpha1
kind: ResourceIntakeAdoptionRegistry
metadata:
  name: resource-intake-adoption
  status: seed
  updated: "2026-06-03"
  authorityRepo: SocioProphet/sociosphere
purpose: >-
  Estate-level registry for resource-intake lessons that cross systems-learning,
  value measurement, triparty release, and workspace governance surfaces.

principles:
  - Observations do not become doctrine without source-backed claims and receipts.
  - Simulation scores are advisory unless a governed triparty face admits release.
  - Donor corpora may be mined for durable patterns without becoming runtime dependencies.
  - Sociosphere records adoption and boundary placement; downstream repos own implementation.

authoritySurfaces:
  learningLoop:
    repo: SocioProphet/systems-learning-loops
    role: source-backed observation, extract, claim, pattern, countermeasure, doctrine, receipt, and reobservation loop
  valueMeasurement:
    repo: SocioProphet/economic-prophet
    role: economic-profit, policy-simulation, Heller mesh, and triparty measurement surface
  estateGovernance:
    repo: SocioProphet/sociosphere
    role: cross-repo adoption, boundary placement, registry, and validation posture

adoptions:
  - id: ai-economist-policy-simulation-intake
    status: active-seed
    sourceCorpus:
      repo: SocioProphet/ai-economist
      upstream: salesforce/ai-economist
      license: BSD-3-Clause
      intakeMode: conceptual-patterns-only
      runtimeDependency: false
    receivingRepo: SocioProphet/economic-prophet
    receivingFiles:
      - docs/policy_simulation_source_intake.md
      - schemas/policy_simulation_profile.schema.json
      - examples/policy_simulation_profile.json
      - src/open_ep_framework/policy_simulation.py
      - tests/test_policy_simulation.py
    gates:
      - donor runtime dependency must remain false
      - reward functionals must remain advisory-only
      - triparty lambda_admit must not exceed lambda_evid
      - triparty lambda_release must not exceed lambda_admit
      - residual must equal lambda_evid minus lambda_release
      - CI must run policy simulation smoke and upload audit artifact
    downstreamConsumers:
      - SocioProphet/economic-prophet
      - SocioProphet/systems-learning-loops
      - SocioProphet/sociosphere
      - SocioProphet/prophet-platform
    nextSteps:
      - add a systems-learning receipt for the donor-corpus pattern extraction
      - register policy-simulation receipts in platform evidence consumers
      - decide whether UVMC should absorb policy-simulation profile summaries as measured entities
