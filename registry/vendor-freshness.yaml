manifest_id: vendor-freshness-plane-v0
status: seed
schema: registry/vendor-freshness.schema.yaml
purpose: >-
  Declare every vendored artifact in the estate — a copy of one repo's build output,
  schema, or ontology living inside another repo, invisible to that repo's dependency
  tooling. Merging an upstream PR does not ship it. Only a re-vendor ships it.

# Seeded 2026-07-29 from a direct walk of ~/dev/prophet-platform and ~/dev/hellgraph.
# Every version, digest, and constant below was read off disk or out of git, not
# inferred. Digests are sha256 over the exact bytes at the recorded path.

policy:
  observation_max_age_days: 90
  default_freshness_policy: track-minor

coverage:
  mechanically_scanned:
    - npm-tarball vendored under a consumer `vendor/` directory
    - package.json `file:` dependency specifiers outside node_modules
  declared_only:
    - json-schema copies (no naming convention distinguishes them from first-party schemas)
    - rdf-ontology copies
    - source-port copies
    - derived-output copies
  note: >-
    Increment 1 can only catch an undeclared artifact in the two mechanically_scanned
    classes. Everything in declared_only depends on a human declaring it, and can
    still go missing from this register without the validator noticing. Closing that
    gap needs provenance markers at the vendoring site, not a smarter scanner.

# ── Sources ─────────────────────────────────────────────────────────────────

sources:
  - source_id: hellgraph-engine
    repo: SocioProphet/hellgraph
    url: https://github.com/SocioProphet/hellgraph
    artifact_kind: npm-tarball
    version_scheme: semver
    package_name: '@socioprophet/hellgraph'
    upstream_ref: main
    upstream_latest_version: 0.4.45
    upstream_latest_ref: v0.4.45
    observed_at: '2026-08-03'
    observation_method: >-
      git ls-remote --tags https://github.com/SocioProphet/hellgraph -> newest semver tag v0.4.45 (dbe854faf5b8)
    # Load-bearing contracts THIS upstream can move, as first-class nodes. A release
    # references one by id; the graph then has a Contract node to hang vfp:changesContract
    # and vfp:guardedBy off, instead of a bare kind string that can be neither's object.
    contracts:
      - contract_id: enrich-receipt
        contract_kind: receipt-shape
        note: >-
          The sealed enrich/explore receipt: sha256 over the derived output plus the
          {seq,nodes,edges} snapshot. apps/compute-gateway pins two golden receipts to it,
          so any release that reaches the code the receipt is computed over obliges a
          byte-identical re-verification before the bump ships.
      - contract_id: cypher-projection
        contract_kind: schema
        note: >-
          What a Cypher pattern is answered WITH. A node-only pattern compiled to zero
          clauses, which findMatches satisfies with one empty binding — so the projection
          shape, not just the values, is the contract.
    # The supersession chain. Version / ref / commit / observed_by are MAINTAINED by
    # `make vendor-freshness-detect`; changes_contract is not, and never will be —
    # what a release moved is a judgement about behaviour, and a detector that read it
    # off the version number would manufacture the false assurance this plane removes.
    # contract_review: pending means the detector appended it and nobody has looked.
    releases:
      - version: '0.1.0'
        ref: v0.1.0
        commit: 3a35f11
        observed_by: detect_vendor_freshness.py on 2026-07-29
        contract_review: pending
