    observed_at: '2026-07-29'
    observation_method: >-
      Not observed, and the upstream attribution is itself unconfirmed. The consumer
      calls these schemas "vendored" in compute_gateway/zerotrust.py but names no
      source repo; the $id host is sourceos.local. Attributed here to the zero-trust
      kernel on the strength of the schema names (Grant, PolicyDecision, QuorumProof,
      AttestationBundle, ToolGrantCheck, MCP Capability Registry). Treat as a lead,
      not a fact.
    observation_gap:
      reason: >-
        Blocked one step EARLIER than the other gaps: the upstream is not merely
        unobservable, it is unconfirmed. SocioProphet/mcp-a2a-zero-trust exists and
        answers ls-remote (main 93c4b831), but nothing in prophet-platform names it —
        zerotrust.py calls the schema set "vendored" and names no repo, and the $id host
        is sourceos.local. Pointing the detector at this repo now would convert a guess
        into a recorded observation, which is worse than the silence: the register would
        assert provenance it does not have, for the shapes the whole proof chain is
        validated against. Confirm the attribution FIRST (diff the six vendored schemas
        against the candidate upstream and either establish or refute it), then declare
        the artifact path. Sooner than the kbpedia gap because these are the zero-trust
        decision contracts, and because refuting the lead is itself a finding worth having.
      revisit_by: '2026-08-31'

# ── Artifacts ───────────────────────────────────────────────────────────────

artifacts:

  # ── The engine: two copies, same tarball, different fates ──
  - artifact_id: hellgraph-engine@hellgraph-service
    tier: foundation  # from the deploy/argocd tier annotation (tier doctrine, prophet-platform #1009)
    tier_reason: >-
      The graph engine THE spine runs on; a stale copy shipped a silent-wrong Cypher projection to production.
    source_id: hellgraph-engine
    consumer_repo: SocioProphet/prophet-platform
    consumer_url: https://github.com/SocioProphet/prophet-platform
    consumer_app: apps/hellgraph-service
    artifact_path: apps/hellgraph-service/vendor/socioprophet-hellgraph-0.4.45.tgz
    vendored_version: 0.4.45
    vendored_digest: 'sha256:be6d645e75b8d00215398c3a46f4cd41c9a5710f6bc95f3b05c4a107b36cbe15'
    freshness_policy: track-minor
    owner: '@mdheller'
    disposition: current
    declared_in:
      - path: apps/hellgraph-service/package.json
        note: 'dependencies["@socioprophet/hellgraph"] = file:vendor/socioprophet-hellgraph-0.4.45.tgz'
      - path: apps/hellgraph-service/package-lock.json
        note: 'resolved = file:vendor/socioprophet-hellgraph-0.4.45.tgz (two occurrences)'
      - path: apps/hellgraph-service/scripts/check-engine-version.mjs
        note: "MIN_ENGINE = '0.4.45' — the floor and the tarball must move together, and did"
      - path: apps/compute-gateway/src/compute_gateway/engine_receipts.py
        note: 'receipt key order documented as pinned from the vendored 0.4.40 dist'
      - path: apps/compute-gateway/tests/test_engine_seal.py
        note: 'golden sealed receipts declared as real 0.4.40 engine output'
      - path: deploy/values/hellgraph-service.yaml
        note: 'memory budget measured against the 0.4.40 batched loader'
    guard:
      path: apps/hellgraph-service/scripts/check-engine-version.mjs
      floor_constant: MIN_ENGINE
      # VERIFIED against the file, not transcribed from memory. It read 0.4.40 here for
      # weeks after prophet-platform #1030 moved it to 0.4.45 — a floor nobody re-reads
      # drifts exactly the way the tarball did.
      floor_value: 0.4.45
      # VERIFIED, not asserted: tools/validate_vendor_freshness.py follows the chain
      # workflow -> make target -> guard path in the consumer repo and fails if it cannot
      # find one. Here: validate-target-diagnostics.yml matrix -> `make engine-guards` ->
      # node apps/hellgraph-service/scripts/check-engine-version.mjs.
      invoked_by_ci: true
      guards_contract: [enrich-receipt, cypher-projection]
    version_marker:
      marker: 'PROP_NS = "prop:"'
      present_in: 0.4.45
      absent_in: 0.4.40
      note: >-
        Must be asserted inside the packed ts/dist/index.js, not against package.json.
        `graph:labels` is explicitly NOT a valid marker — it is present in both
        releases; it was always the write-side key, and the defect was that the read
        side never matched it.
    receipt_fixtures:
      - path: apps/compute-gateway/tests/test_engine_seal.py
        digest: 'sha256:018f2febf0c76f91752ba9726c9a32a4a8d3ca03895a5d877b780c312d34cc71'
        note: 'ENRICH_JSON golden, over graph snapshot {seq:58,nodes:10,edges:8}'
      - path: apps/compute-gateway/tests/test_engine_seal.py
        digest: 'sha256:35a9df2dd74a25fcbb966a41d2949cd7646912d743aeec730a36fa1a1d3a00af'
        note: 'EXPLORE_JSON golden, same snapshot'
    resolved:
      finding_id: VFP-0001
      resolved_on: '2026-07-29'
