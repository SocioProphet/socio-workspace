manifest_id: vendor-freshness-plane-v0
status: seed
schema: registry/vendor-freshness.schema.yaml
purpose: >-
  Declare every vendored artifact in the estate — a copy of one repo's build output,
  schema, or ontology living inside another repo, invisible to that repo's dependency
  tooling. Merging an upstream PR does not ship it. Only a re-vendor ships it.

# Seeded 2026-07-29 from a direct walk of ~/dev/prophet-platform and ~/dev/hellgraph.
# Every version, digest, and constant below was read off disk or out of git, not
# inferred. Digests are sha256 over the exact bytes at the recorded path.

policy:
  observation_max_age_days: 90
  default_freshness_policy: track-minor

coverage:
  mechanically_scanned:
    - npm-tarball vendored under a consumer `vendor/` directory
    - package.json `file:` dependency specifiers outside node_modules
  declared_only:
    - json-schema copies (no naming convention distinguishes them from first-party schemas)
    - rdf-ontology copies
    - source-port copies
    - derived-output copies
  note: >-
    Increment 1 can only catch an undeclared artifact in the two mechanically_scanned
    classes. Everything in declared_only depends on a human declaring it, and can
    still go missing from this register without the validator noticing. Closing that
    gap needs provenance markers at the vendoring site, not a smarter scanner.

# ── Sources ─────────────────────────────────────────────────────────────────

sources:
  - source_id: hellgraph-engine
    repo: SocioProphet/hellgraph
    url: https://github.com/SocioProphet/hellgraph
    artifact_kind: npm-tarball
    version_scheme: semver
    package_name: '@socioprophet/hellgraph'
    upstream_ref: main
    upstream_latest_version: 0.4.45
    upstream_latest_ref: v0.4.45
    observed_at: '2026-07-29'
    observation_method: >-
      git -C ~/dev/hellgraph show origin/main:package.json -> 0.4.45;
      git tag --list 'v0.4.*' --sort=-v:refname | head -1 -> v0.4.45;
      git rev-parse origin/main -> dbe854faf5b8

  - source_id: sourceos-spec-schemas
    repo: SourceOS-Linux/sourceos-spec
    url: https://github.com/SourceOS-Linux/sourceos-spec
    artifact_kind: json-schema
    version_scheme: commit
    upstream_ref: main
    upstream_latest_digest: unknown
    observed_at: '2026-07-29'
    observation_method: >-
      Not observed. sourceos-spec is not materialized in ~/dev, so upstream head was
      not read. The two consumers below pin two DIFFERENT commits of the same schema
      family, which is itself the finding.

  - source_id: kbpedia-kko
    repo: SocioProphet/kbpedia
    url: https://github.com/SocioProphet/kbpedia
    artifact_kind: rdf-ontology
    version_scheme: digest
    upstream_ref: master
    upstream_latest_digest: 'sha256:d907919fb40f20ed39a7fde0e8d114027449d9354a1976ce8248db5634cb7b07'
    workspace_binding: unbound
    workspace_binding_reason: >-
      SocioProphet/kbpedia is not declared in manifest/workspace.toml,
      manifest/workspace.lock.json, or any committed *.repos.toml overlay. The estate
      vendors an ontology from a sovereign fork the workspace manifest does not know
      exists. Binding it is a workspace-composition change with knock-on effects on
      lock coverage and canonical-source validators, so it is declared here and left
      to a follow-up rather than folded in silently.
    observed_at: '2026-07-19'
    observation_method: >-
      Digest recorded in the vendored PROVENANCE.md at retrieval time from
      versions/2.10/kko-demo.n3 on the sovereign fork. Both vendored copies still
      match it byte for byte. Upstream head not re-read on 2026-07-29.

  - source_id: kbpedia-reference-concepts
    repo: SocioProphet/kbpedia
    url: https://github.com/SocioProphet/kbpedia
    artifact_kind: rdf-ontology
    version_scheme: digest
    upstream_ref: master
    upstream_latest_digest: unknown
    workspace_binding: unbound
    workspace_binding_reason: >-
      Same unbound fork as kbpedia-kko. See that source for the reason.
    observed_at: '2026-07-29'
    observation_method: >-
      Not observed. The vendored ABox carries no PROVENANCE.md and no digest
      assertion, so there is nothing recording what it was copied from.

  - source_id: ontogenesis-ontology-index
    repo: SocioProphet/ontogenesis
    url: https://github.com/SocioProphet/ontogenesis
    artifact_kind: derived-output
    version_scheme: commit
    upstream_ref: main
    observed_at: '2026-07-29'
    observation_method: >-
      Vendored artifact self-describes its provenance in its own header
      ("commit":"e791402"). Upstream head not read.

  - source_id: tritrpc-go-bindings
    repo: SocioProphet/TriTRPC
    url: https://github.com/SocioProphet/TriTRPC
    artifact_kind: source-port
    version_scheme: commit
    upstream_ref: main
    observed_at: '2026-07-29'
    observation_method: >-
      Declared in libs/go/tritrpcbridge/PROVENANCE.md. sociosphere already pins
      TriTRPC as a submodule at rev efc114b0132b61472d3abb29007441597bca0cfc in
      manifest/workspace.lock.json; the Go copy in prophet-platform is a second,
      unlinked pin of the same upstream.

  - source_id: regis-entity-graph-schemas
    repo: SocioProphet/regis-entity-graph
    url: https://github.com/SocioProphet/regis-entity-graph
    artifact_kind: json-schema
    version_scheme: digest
    upstream_ref: main
    upstream_latest_digest: unknown
    observed_at: '2026-07-29'
    observation_method: >-
      Not observed. Vendoring is declared in prose only
      (apps/regis-acr-api/src/regis_acr_api/er_spine.py) with no digest assertion.

  - source_id: mcp-a2a-zero-trust-kernel-schemas
    repo: SocioProphet/mcp-a2a-zero-trust
    url: https://github.com/SocioProphet/mcp-a2a-zero-trust
    artifact_kind: json-schema
    version_scheme: digest
    upstream_ref: main
    upstream_latest_digest: unknown
    observed_at: '2026-07-29'
    observation_method: >-
      Not observed, and the upstream attribution is itself unconfirmed. The consumer
      calls these schemas "vendored" in compute_gateway/zerotrust.py but names no
      source repo; the $id host is sourceos.local. Attributed here to the zero-trust
      kernel on the strength of the schema names (Grant, PolicyDecision, QuorumProof,
      AttestationBundle, ToolGrantCheck, MCP Capability Registry). Treat as a lead,
      not a fact.

# ── Artifacts ───────────────────────────────────────────────────────────────

artifacts:

  # ── The engine: two copies, same tarball, different fates ──
  - artifact_id: hellgraph-engine@hellgraph-service
    source_id: hellgraph-engine
    consumer_repo: SocioProphet/prophet-platform
    consumer_url: https://github.com/SocioProphet/prophet-platform
    consumer_app: apps/hellgraph-service
    artifact_path: apps/hellgraph-service/vendor/socioprophet-hellgraph-0.4.40.tgz
    vendored_version: 0.4.40
    vendored_digest: 'sha256:a1f477969c8f335f95d806baeee349c8d1bbfc9e288665f20caa8a2a016aa6e0'
    freshness_policy: track-minor
    owner: '@mdheller'
    disposition: remediation-open
    declared_in:
      - path: apps/hellgraph-service/package.json
        note: 'dependencies["@socioprophet/hellgraph"] = file:vendor/socioprophet-hellgraph-0.4.40.tgz'
      - path: apps/hellgraph-service/package-lock.json
        note: 'resolved = file:vendor/socioprophet-hellgraph-0.4.40.tgz (two occurrences)'
      - path: apps/hellgraph-service/scripts/check-engine-version.mjs
        note: "MIN_ENGINE = '0.4.40' — the floor and the tarball must move together"
      - path: apps/compute-gateway/src/compute_gateway/engine_receipts.py
        note: 'receipt key order documented as pinned from the vendored 0.4.40 dist'
      - path: apps/compute-gateway/tests/test_engine_seal.py
        note: 'golden sealed receipts declared as real 0.4.40 engine output'
      - path: deploy/values/hellgraph-service.yaml
        note: 'memory budget measured against the 0.4.40 batched loader'
    guard:
      path: apps/hellgraph-service/scripts/check-engine-version.mjs
      floor_constant: MIN_ENGINE
      floor_value: 0.4.40
      invoked_by_ci: false
    version_marker:
      marker: 'PROP_NS = "prop:"'
      present_in: 0.4.45
      absent_in: 0.4.40
      note: >-
        Must be asserted inside the packed ts/dist/index.js, not against package.json.
        `graph:labels` is explicitly NOT a valid marker — it is present in both
        releases; it was always the write-side key, and the defect was that the read
        side never matched it.
    receipt_fixtures:
      - path: apps/compute-gateway/tests/test_engine_seal.py
        digest: 'sha256:018f2febf0c76f91752ba9726c9a32a4a8d3ca03895a5d877b780c312d34cc71'
        note: 'ENRICH_JSON golden, over graph snapshot {seq:58,nodes:10,edges:8}'
      - path: apps/compute-gateway/tests/test_engine_seal.py
        digest: 'sha256:35a9df2dd74a25fcbb966a41d2949cd7646912d743aeec730a36fa1a1d3a00af'
        note: 'EXPLORE_JSON golden, same snapshot'
    remediation:
      pull_request: https://github.com/SocioProphet/prophet-platform/pull/1030
      target_version: 0.4.45
      note: >-
        Open, not merged. Moves the tarball 0.4.40 -> 0.4.45 and MIN_ENGINE with it,
        deletes the old tarball, and reports 81/81 tests green. Until it merges,
        production still answers from 0.4.40.
    findings:
      - >-
        Five releases invisible in production. 0.4.45 fixed a silent-wrong Cypher
        defect: MATCH (n:Label) RETURN n answered ONE EMPTY ROW against 9,825 real
        events, HTTP 200, with a queryHash and an evaluatedAtSeq on it. Node-only
        patterns compiled to zero clauses, which findMatches satisfies with one empty
        binding.
      - >-
        The guard that should have caught this is never invoked. check:engine is
        declared as an npm script and has no caller anywhere in prophet-platform — no
        workflow, no Makefile target, no Dockerfile step. Its upstream-staleness step
        is additionally warn-only by construction.

  - artifact_id: hellgraph-engine@lifecycle-warden
    source_id: hellgraph-engine
    consumer_repo: SocioProphet/prophet-platform
    consumer_url: https://github.com/SocioProphet/prophet-platform
    consumer_app: apps/lifecycle-warden
    artifact_path: apps/lifecycle-warden/vendor/socioprophet-hellgraph-0.4.40.tgz
    vendored_version: 0.4.40
