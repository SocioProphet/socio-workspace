    observation_gap:
      reason: >-
        Not "the repo is unreachable" — SocioProphet/kbpedia answers ls-remote today at
        master 3f888b39. It is that version_scheme digest gives the detector no upstream
        artifact PATH to fetch and hash, and this vendoring left none: no PROVENANCE.md,
        no digest assertion, no retrieval date. Nothing states which upstream file
        apps/hellgraph-service/ontology/kbpedia-rc-2.10.n3.gz is a copy of, so there is
        no candidate to compare against. What closes this is provenance archaeology, not
        a poll: identify the upstream path on the fork (kbpedia-kko names
        versions/2.10/kko-demo.n3 and is the shape to copy), record it as
        upstream_artifact_path, and the digest scheme becomes observable from then on.
      revisit_by: '2026-09-30'

