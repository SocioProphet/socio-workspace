        when something imports it; in prophet-platform the only importers are
        apps/market-replay's own emitter and tests, and nothing in CI runs them —
        test-python-apps enumerates eval-fabric-api, evidence-receipts, evidence-console,
        zone-router and semantic-bridge, and market-replay is not among them. The single
        workflow that names market-replay is images.yml, which is push-to-main/dispatch
        only and whose Dockerfile pip-installs and copies src without importing anything.
        Found by the invoked_by_ci verification added in this increment; carried as
        invoked_by_ci: false, which is the same class of finding as check:engine and was
        being masked by a field anyone could assert.
      - >-
        Pins sourceos-spec commit 487e4b61, while apps/hellgraph-service pins
        7d74db81 for the same schema family from the same merged PR (#204). Two
        vendoring sites, two upstream commits, two independent digest mechanisms
        (Python and TypeScript), nothing reconciling them.
