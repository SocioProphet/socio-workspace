      invoked_by_ci: false
    version_marker:
      marker: 'PROP_NS = "prop:"'
      present_in: 0.4.45
      absent_in: 0.4.40
    remediation:
      finding_id: VFP-0001
      target_version: 0.4.45
      due: '2026-09-30'
      note: >-
        No PR. Explicitly out of scope of PR #1030, which says so in its own body.
        This copy is byte-identical to the hellgraph-service one and equally stale,
        and it is the reason this register exists: the second copy was never noticed
        because nothing enumerated the first.
    findings:
      - >-
        Second, separate copy of the same tarball. Same bytes
        (sha256:a1f47796...), same staleness, no guard at all — no
        check-engine-version.mjs, no check:engine script. A per-app vendor directory
