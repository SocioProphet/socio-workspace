schema_version: "0.1"
registry_id: "sociosphere:readiness:workspace-prophet"
capability_id: "workspace_operation_prophet_membrane_v0"
capability_title: "WorkspaceOperation + PROPHET Membrane E2E"
readiness_state: "fixture_validated"
production_ready: false
owner_plane: "workspace-controller"
contract_authority:
  repo: "SocioProphet/prophet-core-contracts"
  artifacts:
    - "docs/platform-root-spine-v0.md"
    - "docs/prophet-execution-membrane-v0.md"
    - "schemas/scoped-capability.schema.json"
    - "schemas/action-receipt.schema.json"
    - "schemas/claim-record.schema.json"
    - "schemas/evidence-thread.schema.json"
runtime_consumer:
  repo: "SocioProphet/prophet-platform"
  artifacts:
    - "contracts/workspace-prophet/e2e/workspace-operation-prophet-membrane-v0.json"
    - "contracts/workspace-prophet/e2e/action-receipt-workspace-operation-prophet-v0.json"
    - "contracts/workspace-prophet/e2e/claim-projection-workspace-operation-prophet-v0.json"
    - "tools/validate_workspace_prophet_membrane_e2e.py"
    - "tools/validate_workspace_prophet_claim_projection.py"
search_consumer:
  repo: "SocioProphet/sherlock-search"
  artifacts:
    - "examples/workspace-prophet/search-packet.example.json"
    - "scripts/validate_workspace_prophet_search_packet.py"
validated_evidence:
  - evidence_id: "contracts_green"
    repo: "SocioProphet/prophet-core-contracts"
    command: "make validate"
    observed_state: "passed"
    evidence_class: "local_user_observed"
  - evidence_id: "platform_membrane_green"
    repo: "SocioProphet/prophet-platform"
    command: "python3 tools/validate_workspace_prophet_membrane_e2e.py"
    observed_state: "passed"
    evidence_class: "local_user_observed"
  - evidence_id: "platform_projection_green"
    repo: "SocioProphet/prophet-platform"
    command: "python3 tools/validate_workspace_prophet_claim_projection.py"
    observed_state: "passed"
    evidence_class: "local_user_observed"
  - evidence_id: "sherlock_search_packet_green"
    repo: "SocioProphet/sherlock-search"
    command: "python3 scripts/validate_workspace_prophet_search_packet.py"
    observed_state: "passed"
    evidence_class: "local_user_observed"
claim_chain:
  - "WorkspaceOperation"
  - "ScopedCapability"
  - "ActionReceipt"
  - "ClaimRecord"
  - "EvidenceThread"
  - "SherlockSearchPacket"
non_claims:
  - "Does not certify production readiness."
  - "Does not execute a production action."
  - "Does not certify live policy engine integration."
  - "Does not certify durable ledger persistence."
  - "Does not certify Sociosphere SVF runtime execution."
next_gates:
  - gate_id: "makefile_hook"
    description: "Wire prophet-platform Makefile target for validate-workspace-prophet-membrane-e2e."
    status: "open"
  - gate_id: "sociosphere_validator"
    description: "Add a Sociosphere readiness validator for this registry entry."
    status: "open"
  - gate_id: "ledger_receipt_persistence"
    description: "Persist ActionReceipt through model-governance-ledger or prophet-core-ledger."
    status: "planned"
