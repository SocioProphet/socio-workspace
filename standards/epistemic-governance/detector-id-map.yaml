    succeeds_into: LOGFALL.EMOTION.V2
  - emitted_id: LOGFALL.CIRCULAR.V1
    standard_id: LOGFALL.CIRCULAR.V1
    family: LOGFALL
    succeeds_into: null
  - emitted_id: LOGFALL.SUNKCOST.V1
    standard_id: LOGFALL.SUNKCOST.V1
