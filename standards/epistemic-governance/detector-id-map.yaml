# Consumed by:
#   - agentplane hygiene runtime (tools/hygiene_runtime.py) — vendors a byte-copy
#     of this file and rejects any detector_id not present as a standard_id here.
#   - Noetica boundary translation — maps DetectorHit.ruleId (emitted_id) to
#     standard_id before a hit crosses into a passport.
